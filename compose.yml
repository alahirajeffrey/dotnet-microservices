services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongo_data:/data/db

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: otel-collector
    restart: unless-stopped
    entrypoint: ["/otelcol-contrib"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT}:4318"
    environment:
      OTEL_COLLECTOR_GRPC_PORT: ${OTEL_COLLECTOR_GRPC_PORT}
      OTEL_COLLECTOR_HTTP_PORT: ${OTEL_COLLECTOR_HTTP_PORT}
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    ports:
      - "${TEMPO_PORT}:3200"
      # - "4317:4317"
      # - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - tempo
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    depends_on:
      - authservice
      - productservice
      - orderservice
      - paymentservice
      - logservice
      - otel-collector
      - tempo
      - grafana
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: authservice
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      ConnectionStrings__DefaultConnection: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${AUTH_DB_NAME:-authdb};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Jwt__Key: ${JWT_KEY:-O9tFWSYaGPz9jf0yA3FRH5b4BU4j+6m1O8koAqY/hNIguKUfOaw1z+EJvydAXeR7E+QHy2Mfz0UVkWK0lFB+ew==}
      Jwt__Issuer: ${JWT_ISSUER:-AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-Dotnet-Microservices}

  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    container_name: productservice
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${PRODUCT_SERVICE_PORT:-5103}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      ConnectionStrings__DefaultConnection: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${PRODUCT_DB_NAME:-productdb};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      RabbitMQ__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      InternalApi__Secret: ${INTERNAL_API_SECRET:-internal-secret}
      Jwt__Key: ${JWT_KEY:-O9tFWSYaGPz9jf0yA3FRH5b4BU4j+6m1O8koAqY/hNIguKUfOaw1z+EJvydAXeR7E+QHy2Mfz0UVkWK0lFB+ew==}
      Jwt__Issuer: ${JWT_ISSUER:-AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-Dotnet-Microservices}

  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: orderservice
    restart: unless-stopped
    depends_on:
      - postgres
      - productservice
    ports:
      - "${ORDER_SERVICE_PORT:-5150}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      ConnectionStrings__DefaultConnection: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${ORDER_DB_NAME:-orderdb};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ProductService__BaseUrl: http://${PRODUCT_SERVICE_HOST:-productservice}:${SERVICE_INTERNAL_PORT:-8080}
      RabbitMQ__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      InternalApi__Secret: ${INTERNAL_API_SECRET:-internal-secret}
      Jwt__Key: ${JWT_KEY:-O9tFWSYaGPz9jf0yA3FRH5b4BU4j+6m1O8koAqY/hNIguKUfOaw1z+EJvydAXeR7E+QHy2Mfz0UVkWK0lFB+ew==}
      Jwt__Issuer: ${JWT_ISSUER:-AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-Dotnet-Microservices}

  paymentservice:
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    container_name: paymentservice
    restart: unless-stopped
    depends_on:
      - postgres
      - orderservice
    ports:
      - "${PAYMENT_SERVICE_PORT:-5117}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      ConnectionStrings__DefaultConnection: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${PAYMENT_DB_NAME:-paymentdb};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      OrderService__BaseUrl: http://${ORDER_SERVICE_HOST:-orderservice}:${SERVICE_INTERNAL_PORT:-8080}
      RabbitMQ__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY:-your_paystack_secret_key}
      Paystack__CallbackUrl: http://localhost:${PAYMENT_SERVICE_PORT:-5117}/api/webhook/paystack
      InternalApi__Secret: ${INTERNAL_API_SECRET:-internal-secret}
      Jwt__Key: ${JWT_KEY:-O9tFWSYaGPz9jf0yA3FRH5b4BU4j+6m1O8koAqY/hNIguKUfOaw1z+EJvydAXeR7E+QHy2Mfz0UVkWK0lFB+ew==}
      Jwt__Issuer: ${JWT_ISSUER:-AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-Dotnet-Microservices}

  logservice:
    build:
      context: .
      dockerfile: LogService/Dockerfile
    container_name: logservice
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "${LOG_SERVICE_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      MongoDb__Host: ${MONGODB_HOST:-mongodb}
      MongoDb__Port: ${MONGODB_PORT:-27017}
      MongoDb__Username: ${MONGODB_USERNAME}
      MongoDb__Password: ${MONGODB_ROOT_PASSWORD}
      MongoDb__DatabaseName: ${MONGODB_DATABASE:-logdb}
      RabbitMQ__HostName: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
  tempo-data:
